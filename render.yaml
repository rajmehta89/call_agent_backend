services:
  - type: web
    name: ai-agent-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: ai_agent_assist
      - key: APP_ENV
        value: production
      - key: RELAYDESK_PUBLIC_APP_URL
        value: https://moxper.vercel.app
      - key: CORS_ORIGINS
        value: https://moxper.vercel.app
      - key: AUTH_SECRET
        sync: false
